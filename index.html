<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe9">
  <title>OSAKA 2026｜Janice's Journey</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <div id="boot" class="boot">正在讀取 Osaka 2026…</div>

  <div id="app" class="hidden">
    <header class="hero">
      <div class="hero-shade"></div>
      <div class="hero-inner">
        <div class="eyebrow">TRAVEL COMPANION V2.0.0</div>
        <h1>OSAKA 2026<br><span>Janice’s Journey</span></h1>
        <p id="tripDates">2026.08.12—08.17｜6天5夜</p>

        <div class="hero-grid">
          <div class="hero-chip">
            <small>去程</small>
            <b>BR176</b>
            <span>14:20 桃園 T2 → 18:00 神戶 T2</span>
          </div>
          <div class="hero-chip">
            <small>回程</small>
            <b>BR175</b>
            <span>19:00 神戶 T2 → 20:55 桃園 T2</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="homePage" class="page active">
        <div class="dashboard-grid">
          <article class="metric-card">
            <small>COUNTDOWN</small>
            <strong id="countdown">—</strong>
            <span>距離出發</span>
          </article>
          <article class="metric-card">
            <small>TODAY</small>
            <strong id="todayLabel">行前準備</strong>
            <span id="todaySummary">整理票券與必買清單</span>
          </article>
        </div>

        <section class="panel">
          <div class="section-head">
            <div><small>6-DAY FORECAST</small><h2>六天天氣</h2></div>
            <button id="refreshWeather" class="text-btn">更新</button>
          </div>
          <div id="forecastStrip" class="forecast-strip"></div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div><small>HOTEL</small><h2>住宿資訊</h2></div>
          </div>
          <article id="hotelCard" class="hotel-card"></article>
        </section>

        <section class="panel">
          <div class="section-head">
            <div><small>QUICK ACCESS</small><h2>快速入口</h2></div>
          </div>
          <div class="quick-grid">
            <button data-page-target="itineraryPage">查看每日行程</button>
            <button data-page-target="todayPage">今日快速模式</button>
            <a target="_blank" href="https://www.google.com/maps/search/?api=1&query=Sotetsu+Fresa+Inn+Osaka+Shinsaibashi">飯店導航</a>
            <button id="exportData">匯出旅程 JSON</button>
          </div>
        </section>
      </section>

      <section id="todayPage" class="page">
        <div class="page-head">
          <div><small>TODAY MODE</small><h2>今日快速模式</h2></div>
        </div>
        <div id="todayWeather"></div>
        <div id="todayItems"></div>
      </section>

      <section id="itineraryPage" class="page">
        <div class="page-head">
          <div><small>ITINERARY</small><h2>每日行程</h2></div>
        </div>
        <div id="dayTabs" class="day-tabs"></div>
        <div id="dayContent"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-page="homePage" class="active"><span>⌂</span>首頁</button>
      <button data-page="todayPage"><span>◎</span>今日</button>
      <button data-page="itineraryPage"><span>▣</span>行程</button>
    </nav>
  </div>

  <script type="module" src="./assets/app.m2.js"></script>
</body>
</html>
